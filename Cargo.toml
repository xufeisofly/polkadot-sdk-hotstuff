[workspace]
resolver = "2"
members = ["client", "primitives", "bls", "pallet", "examples/solochain/runtime", "examples/solochain/pallets/template", "examples/solochain/node"]
exclude = [".cache"]
[workspace.package]
authors = ["Pacifica Foundation"]
edition = "2021"
homepage = "https://github.com/paritytech/polkadot-sdk"
repository = "https://github.com/xufeisofly/polkadot-sdk-hotstuff"
[workspace.lints.rust]
unexpected_cfgs = "allow"
[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
strip = "debuginfo"
[workspace.dependencies]
array-bytes = { version = "6.2.2", default-features = false }
async-trait = { version = "0.1.88" }
bls12_381 = { version = "0.8.0", default-features = false }
blst_lib = { version = "0.3.10", package = "blst" }
blstrs = { version = "0.7.0" }
clap = { version = "4.5.13" }
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec" }
ff = "0.13"
frame-benchmarking = { default-features = false, version = "=49.0.0" }
frame-executive = { default-features = false, version = "=48.0.0" }
frame-metadata-hash-extension = { default-features = false, version = "=0.16.0" }
frame-support = { default-features = false, version = "=48.1.0" }
frame-system = { default-features = false, version = "=48.0.0" }
frame-system-benchmarking = { default-features = false, version = "=49.0.0" }
frame-system-rpc-runtime-api = { default-features = false, version = "=43.0.0" }
frame-try-runtime = { default-features = false, version = "=0.54.0" }
futures = { version = "0.3.31" }
group = { version = "0.13", default-features = false }
hex = { version = "0.4.3", default-features = false }
hkdf = { version = "0.11.0" }
sc-consensus-hotstuff-bls = { path = "bls" }
jsonrpsee = { version = "0.24.11" }
log = { version = "0.4.22", default-features = false }
pairing_lib = { version = "0.23.0", package = "pairing", default-features = false }
pallet-balances = { default-features = false, version = "=50.0.0" }
pallet-session = { default-features = false, version = "=49.0.0" }
pallet-sudo = { default-features = false, version = "=49.0.0" }
pallet-template = { path = "examples/solochain/pallets/template", default-features = false }
pallet-timestamp = { default-features = false, version = "=48.0.0" }
pallet-transaction-payment = { default-features = false, version = "=49.0.0" }
pallet-transaction-payment-rpc = { default-features = false, version = "=52.0.0" }
pallet-transaction-payment-rpc-runtime-api = { default-features = false, version = "=49.0.0" }
parking_lot = { version = "0.12.1", default-features = false }
prometheus-endpoint = { default-features = false, package = "substrate-prometheus-endpoint", version = "0.17.7" }
rand = { version = "0.9" }
rand_core = { version = "0.9" }
rayon = { version = "1" }
sc-authority-discovery = { default-features = false, version = "=0.60.0" }
sc-basic-authorship = { default-features = false, version = "=0.56.0" }
sc-block-builder = { default-features = false, version = "=0.51.0" }
sc-chain-spec = { default-features = false, version = "=52.0.0" }
sc-cli = { default-features = false, version = "=0.62.0" }
