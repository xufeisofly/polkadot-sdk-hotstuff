sc-consensus = { default-features = false, version = "=0.58.0" }
sc-executor = { default-features = false, version = "=0.50.0" }
sc-keystore = { default-features = false, version = "=42.0.0" }
sc-network = { default-features = false, version = "=0.59.1" }
