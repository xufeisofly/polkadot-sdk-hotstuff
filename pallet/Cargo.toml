[package]
license = "Unlicense"
name                 = "pallet-hotstuff"
version              = "0.1.0"
authors.workspace    = true
edition.workspace    = true
homepage.workspace   = true
repository.workspace = true

[dependencies]
codec                   = { features = ["derive"], workspace = true }
frame-support.workspace = true
frame-system.workspace  = true
scale-info              = { features = ["derive"], workspace = true }
sp-runtime              = { workspace = true }
sp-std                  = { workspace = true }
sp-core                 = { workspace = true }
sp-consensus-hotstuff         = { workspace = true }
log                     = { workspace = true }
pallet-session          = { workspace = true }


[dev-dependencies]
sp-io           = { default-features = true, workspace = true }
sp-core         = { default-features = true, workspace = true }
sp-runtime      = { default-features = true, workspace = true }
sp-staking      = { default-features = true, workspace = true }
frame-support   = { default-features = true, workspace = true }
frame-system    = { default-features = true, workspace = true }
pallet-balances = { default-features = true, workspace = true }
pallet-session  = { default-features = true, workspace = true }
sc-consensus-hotstuff-bls  = { workspace = true }


[features]
default = ["std"]
std = [
  "codec/std",
  "frame-support/std",
  "frame-system/std",
  "scale-info/std",
  "sp-runtime/std",
  "sp-core/std",
  "sp-io/std",
  "sp-std/std",
  "sp-consensus-hotstuff/std",
  "log/std",
  "pallet-session/std",
]
# runtime-benchmarks = [
#   "frame-benchmarking/runtime-benchmarks",
#   "frame-support/runtime-benchmarks",
#   "frame-system/runtime-benchmarks",
#   "sp-runtime/runtime-benchmarks",
# ]
try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",
  "sp-runtime/try-runtime",
  "pallet-session/try-runtime",
]
